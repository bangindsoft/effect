<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Eye Color Changer</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
    }

    .sidebar {
      background: #020617;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 2; /* Agar sidebar tetap di atas saat foto di-zoom */
    }

    .header h1 {
      margin: 0 0 5px 0;
      color: var(--accent);
      font-size: 1.4rem;
    }
    .header p {
      margin: 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      background: #475569;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
      color: #cbd5e1;
    }
    .status-ready { background: #065f46; color: #a7f3d0; }

    .control-group { display: flex; flex-direction: column; }
    
    .control-group label {
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    input[type="file"] {
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
    }
    input[type="file"]::file-selector-button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 10px;
      font-weight: bold;
    }
    input[type="file"]:disabled::file-selector-button {
      background: #475569;
      cursor: not-allowed;
    }

    input[type="color"] {
      width: 100%;
      height: 40px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      padding: 2px;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-main);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .canvas-wrapper {
      width: 100%;
      background: repeating-conic-gradient(#334155 0% 25%, #1e293b 0% 50%) 50% / 20px 20px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
      border: 1px solid var(--border);
      overflow: hidden; /* Mencegah foto meluber keluar saat di-zoom */
      position: relative;
    }

    canvas {
      max-width: 100%;
      max-height: 75vh;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      cursor: grab;
      transition: transform 0.05s linear; /* Efek smooth saat di-zoom */
    }
    canvas:active {
      cursor: grabbing;
    }

    .placeholder-text {
      position: absolute;
      color: var(--text-muted);
      font-size: 1.1rem;
      pointer-events: none;
      text-align: center;
      padding: 20px;
    }

    .loading-overlay {
      position: absolute;
      background: rgba(15, 23, 42, 0.85);
      color: #10b981;
      padding: 15px 25px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.1rem;
      display: none;
      z-index: 10;
      border: 1px solid #10b981;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    
    .zoom-hint {
      position: absolute;
      bottom: 15px;
      right: 15px;
      background: rgba(2, 6, 23, 0.7);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      color: #94a3b8;
      pointer-events: none;
      display: none;
      z-index: 10;
      border: 1px solid var(--border);
    }

    .btn-download {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 25px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
      width: 100%;
    }
    .btn-download:hover { background: var(--accent-hover); }
  </style>
</head>
<body>

<div class="container">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="header">
      <h1>👁️ AI Eye Color</h1>
      <p>Automatically detects eyes and applies realistic color blending.</p>
    </div>

    <div id="ai-status" class="status-badge">⏳ Loading AI Model...</div>

    <hr style="width: 100%; border: 0.5px solid #334155; margin: 5px 0;">

    <div class="control-group">
      <label>1. Upload Face Photo</label>
      <input type="file" id="inp-file" accept="image/*" disabled>
    </div>

    <div class="control-group">
      <label>2. Select Eye Color</label>
      <input type="color" id="inp-color" value="#00aaff">
    </div>

    <div class="control-group">
      <label>3. Blend Mode</label>
      <select id="inp-blend">
        <option value="color">Color (Most Natural)</option>
        <option value="overlay">Overlay (High Contrast)</option>
        <option value="hue">Hue (Tone Only)</option>
        <option value="soft-light">Soft Light (Subtle)</option>
      </select>
    </div>

    <div class="control-group">
      <label>4. Color Intensity: <span id="val-opacity">70</span>%</label>
      <input type="range" id="inp-opacity" min="0" max="100" value="70">
    </div>

    <button class="btn-download" id="btn-download">⬇️ Download Result</button>
  </div>

  <!-- Main Canvas -->
  <div class="canvas-wrapper" id="canvas-wrapper">
    <div id="placeholder" class="placeholder-text">Wait for AI to be "Ready",<br>then upload a clear face photo.</div>
    <div id="loading" class="loading-overlay">⏳ Detecting eyes...</div>
    <div id="zoom-hint" class="zoom-hint">🖱️ Scroll to Zoom | Drag to Pan | Dbl-Click to Reset</div>
    <canvas id="canvas" style="display: none;"></canvas>
  </div>
</div>

<!-- Hidden image element to read source file -->
<img id="source-img" style="display: none;">

<script type="module">
  import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

  const canvas = document.getElementById('canvas');
  const canvasWrapper = document.getElementById('canvas-wrapper');
  const ctx = canvas.getContext('2d');
  const placeholder = document.getElementById('placeholder');
  const loadingOverlay = document.getElementById('loading');
  const zoomHint = document.getElementById('zoom-hint');
  const sourceImg = document.getElementById('source-img');
  
  const inpFile = document.getElementById('inp-file');
  const inpColor = document.getElementById('inp-color');
  const inpBlend = document.getElementById('inp-blend');
  const inpOpacity = document.getElementById('inp-opacity');
  const valOpacity = document.getElementById('val-opacity');
  const btnDownload = document.getElementById('btn-download');
  const aiStatus = document.getElementById('ai-status');

  let faceLandmarker = null;
  let currentLandmarks = []; 

  // Variabel untuk fitur Zoom & Pan
  let scale = 1;
  let pointX = 0;
  let pointY = 0;
  let startX = 0;
  let startY = 0;
  let isPanning = false;

  // 1. INITIALIZE AI MEDIAPIPE
  async function initializeAI() {
    try {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
      );
      
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "IMAGE",
        numFaces: 4, 
        outputFaceBlendshapes: false
      });

      aiStatus.textContent = "✅ AI Ready to Use!";
      aiStatus.classList.add("status-ready");
      inpFile.disabled = false; 
      placeholder.innerHTML = "Upload a portrait photo to begin.<br>Eyes will be colored automatically.";
    } catch (error) {
      aiStatus.textContent = "❌ Failed to load AI.";
      console.error(error);
    }
  }

  initializeAI();

  // 2. HANDLE UPLOAD
  inpFile.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    placeholder.style.display = 'none';
    loadingOverlay.style.display = 'block';
    zoomHint.style.display = 'none';

    const reader = new FileReader();
    reader.onload = (event) => {
      sourceImg.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  // 3. PROCESS ON IMAGE LOAD
  sourceImg.onload = () => {
    const MAX_SIZE = 1920;
    let imgScale = 1;
    if (sourceImg.width > MAX_SIZE || sourceImg.height > MAX_SIZE) {
        imgScale = Math.min(MAX_SIZE / sourceImg.width, MAX_SIZE / sourceImg.height);
    }
    canvas.width = sourceImg.width * imgScale;
    canvas.height = sourceImg.height * imgScale;

    // Reset Zoom & Pan tiap kali upload foto baru
    scale = 1;
    pointX = 0;
    pointY = 0;
    updateTransform();

    ctx.drawImage(sourceImg, 0, 0, canvas.width, canvas.height);
    canvas.style.display = 'block';

    setTimeout(() => {
      const results = faceLandmarker.detect(sourceImg);
      currentLandmarks = results.faceLandmarks;
      
      loadingOverlay.style.display = 'none';
      zoomHint.style.display = 'block'; // Tampilkan panduan zoom

      if (currentLandmarks.length === 0) {
        alert("Oops, the AI couldn't detect a face in this photo. Try a brighter, front-facing image.");
      }

      renderEffect();
    }, 100); 
  };

  // 4. TRIGGER RENDER ON SETTING CHANGE
  [inpColor, inpBlend, inpOpacity].forEach(el => {
    el.addEventListener('input', () => {
      if (el === inpOpacity) valOpacity.innerText = el.value;
      renderEffect();
    });
  });

  // 5. DRAW IRIS FUNCTION
  function drawIris(landmarks, centerIdx, rightEdgeIdx, color, hexColor) {
    const w = canvas.width;
    const h = canvas.height;

    const cx = landmarks[centerIdx].x * w;
    const cy = landmarks[centerIdx].y * h;
    const ex = landmarks[rightEdgeIdx].x * w;
    const ey = landmarks[rightEdgeIdx].y * h;
    
    const radius = Math.hypot(ex - cx, ey - cy) * 1.1; 

    const gradient = ctx.createRadialGradient(cx, cy, radius * 0.2, cx, cy, radius);
    gradient.addColorStop(0, hexColor);
    gradient.addColorStop(0.7, hexColor);
    gradient.addColorStop(1, "transparent"); 

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
    ctx.fill();
  }

  // 6. MAIN RENDER EFFECT
  function renderEffect() {
    if (!sourceImg.src) return;

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1.0;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(sourceImg, 0, 0, canvas.width, canvas.height);

    if (currentLandmarks.length === 0) return;

    const color = inpColor.value;
    const blendMode = inpBlend.value;
    const opacity = inpOpacity.value / 100;

    ctx.globalCompositeOperation = blendMode; 
    ctx.globalAlpha = opacity;

    for (const face of currentLandmarks) {
      drawIris(face, 468, 469, blendMode, color); // Kanan
      drawIris(face, 473, 474, blendMode, color); // Kiri
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1.0;
  }

  // 7. DOWNLOAD BUTTON (Memastikan yang di-download adalah foto asli, bukan foto yang sedang ter-zoom/terpotong layarnya)
  btnDownload.addEventListener('click', () => {
    if (!sourceImg.src) {
      alert("Please upload a photo first!");
      return;
    }
    const link = document.createElement('a');
    link.download = 'AI_Eye_Color_Edited.png';
    link.href = canvas.toDataURL('image/png', 0.9);
    link.click();
  });

  // ==========================================
  // FITUR PAN (GESER) & ZOOM MOUSE WHEEL
  // ==========================================
  
  function updateTransform() {
    canvas.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
  }

  // Aksi Scroll Mouse untuk Zoom In / Out
  canvasWrapper.addEventListener('wheel', (e) => {
    if (canvas.style.display === 'none') return;
    e.preventDefault();

    // Tentukan arah scroll
    const zoomDirection = e.deltaY < 0 ? 1.1 : 0.9;
    
    // Dapatkan posisi kursor mouse
    const rect = canvasWrapper.getBoundingClientRect();
    const cursorX = e.clientX - rect.left;
    const cursorY = e.clientY - rect.top;

    let newScale = scale * zoomDirection;
    newScale = Math.max(1, Math.min(newScale, 15)); // Batas zoom 1x sampai 15x

    if (newScale !== scale) {
      // Kalkulasi agar zoom mengarah tepat ke posisi kursor mouse (Zoom to pointer)
      const ratio = 1 - (newScale / scale);
      pointX += (cursorX - (rect.width / 2) - pointX) * ratio;
      pointY += (cursorY - (rect.height / 2) - pointY) * ratio;
      
      scale = newScale;
      updateTransform();
    }
  });

  // Aksi Klik Kiri untuk memulai Pan (Geser)
  canvas.addEventListener('mousedown', (e) => {
    e.preventDefault();
    isPanning = true;
    startX = e.clientX - pointX;
    startY = e.clientY - pointY;
  });

  // Aksi melepas Klik atau kursor keluar dari layar
  window.addEventListener('mouseup', () => { isPanning = false; });
  window.addEventListener('mouseleave', () => { isPanning = false; });

  // Aksi pergerakan Mouse untuk menggeser foto
  window.addEventListener('mousemove', (e) => {
    if (!isPanning) return;
    e.preventDefault();
    pointX = e.clientX - startX;
    pointY = e.clientY - startY;
    updateTransform();
  });

  // Aksi Double Click untuk Reset Zoom
  canvas.addEventListener('dblclick', () => {
    scale = 1;
    pointX = 0;
    pointY = 0;
    updateTransform();
  });

</script>
</body>
</html>
