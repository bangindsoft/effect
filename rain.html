<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rain Effect Photo Generator</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --accent: #0ea5e9;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
    }

    .sidebar {
      background: #020617;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .header h1 {
      margin: 0 0 5px 0;
      color: var(--accent);
      font-size: 1.4rem;
    }

    .header p {
      margin: 0 0 15px 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .control-group {
      display: flex;
      flex-direction: column;
    }

    .control-group label {
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    input[type="file"] {
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
    }
    input[type="file"]::file-selector-button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 10px;
      font-weight: bold;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .main-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .canvas-wrapper {
      width: 100%;
      background: repeating-conic-gradient(#334155 0% 25%, #1e293b 0% 50%) 50% / 20px 20px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
    }

    canvas {
      max-width: 100%;
      max-height: 75vh;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }

    .placeholder-text {
      position: absolute;
      color: var(--text-muted);
      font-size: 1.2rem;
      pointer-events: none;
    }

    .btn-download {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 25px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
      width: 100%;
    }
    .btn-download:hover { background: var(--accent-hover); }

  </style>
</head>
<body>

<div class="container">
  <!-- Sidebar Controls -->
  <div class="sidebar">
    <div class="header">
      <h1>🌧️ Rain Effect Maker</h1>
      <p>Upload a photo & add realistic rain.</p>
    </div>

    <div class="control-group">
      <label>Upload Photo</label>
      <input type="file" id="inp-file" accept="image/*">
    </div>

    <hr style="width: 100%; border: 0.5px solid #334155; margin: 5px 0;">

    <div class="control-group">
      <label>Rain Density: <span id="val-density">50</span>%</label>
      <input type="range" id="inp-density" min="0" max="100" value="50">
    </div>

    <div class="control-group">
      <label>Wind Angle (Direction)</label>
      <input type="range" id="inp-angle" min="-45" max="45" value="15">
    </div>

    <div class="control-group">
      <label>Motion Blur / Length</label>
      <input type="range" id="inp-length" min="10" max="150" value="60">
    </div>

    <div class="control-group">
      <label>Rain Opacity</label>
      <input type="range" id="inp-opacity" min="10" max="100" value="70">
    </div>

    <div class="control-group">
      <label>Moody Lighting (Darken)</label>
      <input type="range" id="inp-mood" min="0" max="80" value="30">
    </div>

    <button class="btn-download" id="btn-download">⬇️ Download Photo</button>
  </div>

  <!-- Main Canvas Area -->
  <div class="main-area">
    <div class="canvas-wrapper">
      <div id="placeholder" class="placeholder-text">Please upload an image first</div>
      <canvas id="canvas" style="display: none;"></canvas>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const placeholder = document.getElementById('placeholder');
  
  const inpFile = document.getElementById('inp-file');
  const inpDensity = document.getElementById('inp-density');
  const valDensity = document.getElementById('val-density');
  const inpAngle = document.getElementById('inp-angle');
  const inpLength = document.getElementById('inp-length');
  const inpOpacity = document.getElementById('inp-opacity');
  const inpMood = document.getElementById('inp-mood');
  const btnDownload = document.getElementById('btn-download');

  let currentImage = null;
  let rainData = [[], [], []]; // Array untuk 3 layer kedalaman hujan

  // Generate data hujan statis (agar tidak berkedip saat slider digeser)
  function generateRainData() {
    const maxDrops = 10000; // Total maksimal rintik
    rainData = [[], [], []];
    
    for (let i = 0; i < maxDrops; i++) {
      // Posisi acak dari -0.5 sampai 1.5 agar mencakup area tepi saat hujan miring
      const x = (Math.random() * 2) - 0.5;
      const y = (Math.random() * 2) - 0.5;
      const layer = Math.floor(Math.random() * 3); // Layer 0 (belakang), 1 (tengah), 2 (depan)
      const lengthMod = Math.random() * 0.5 + 0.5; // Variasi panjang per rintik
      
      rainData[layer].push({ x, y, lengthMod });
    }
  }

  // Panggil sekali saat dimuat
  generateRainData();

  // Handle Image Upload
  inpFile.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        placeholder.style.display = 'none';
        canvas.style.display = 'block';
        
        // Batasi ukuran maksimal canvas agar tidak berat (Max 1920px)
        const MAX_SIZE = 1920;
        let scale = 1;
        if (img.width > MAX_SIZE || img.height > MAX_SIZE) {
            scale = Math.min(MAX_SIZE / img.width, MAX_SIZE / img.height);
        }
        
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        
        renderEffect();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  // Event Listener untuk semua Slider
  [inpDensity, inpAngle, inpLength, inpOpacity, inpMood].forEach(el => {
    el.addEventListener('input', () => {
      if (el === inpDensity) valDensity.innerText = el.value;
      renderEffect();
    });
  });

  // Fungsi Render Utama
  function renderEffect() {
    if (!currentImage) return;

    const w = canvas.width;
    const h = canvas.height;
    
    // 1. Gambar ulang foto asli
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(currentImage, 0, 0, w, h);

    // 2. Terapkan Moody Lighting (Cuaca mendung kebiruan)
    const moodVal = inpMood.value / 100;
    if (moodVal > 0) {
      ctx.fillStyle = `rgba(15, 25, 45, ${moodVal})`;
      ctx.fillRect(0, 0, w, h);
    }

    // 3. Persiapan Variabel Hujan
    // Skala hujan menyesuaikan resolusi gambar, menggunakan diagonal gambar sebagai basis ukuran
    const diagScale = Math.sqrt(w * w + h * h) / 1000; 
    
    const densityPercent = inpDensity.value / 100;
    const angleRad = inpAngle.value * (Math.PI / 180);
    const baseLength = inpLength.value * diagScale;
    const globalRainOpacity = inpOpacity.value / 100;

    const maxDropsPerLayer = Math.floor((rainData[0].length) * densityPercent);
    const dx = Math.sin(angleRad);
    const dy = Math.cos(angleRad);

    // Mode blend "Screen" untuk meniru efek cahaya/putih di Photoshop
    ctx.globalCompositeOperation = 'screen';
    ctx.lineCap = 'round';
    
    // Konfigurasi visual untuk 3 Layer kedalaman (Belakang, Tengah, Depan)
    const layerConfigs = [
      { width: 1 * diagScale, opacity: 0.3 * globalRainOpacity, lengthMultiplier: 0.6 },
      { width: 2 * diagScale, opacity: 0.5 * globalRainOpacity, lengthMultiplier: 1.0 },
      { width: 3.5 * diagScale, opacity: 0.8 * globalRainOpacity, lengthMultiplier: 1.8 }
    ];

    // 4. Menggambar Hujan (Sistem Path Layering untuk Performa Maksimal)
    for (let l = 0; l < 3; l++) {
      const config = layerConfigs[l];
      const drops = rainData[l];
      
      ctx.lineWidth = config.width;
      ctx.strokeStyle = `rgba(255, 255, 255, ${config.opacity})`;
      ctx.beginPath(); // Gambar semua line di layer ini dalam satu path

      for (let i = 0; i < maxDropsPerLayer; i++) {
        let drop = drops[i];
        
        let startX = drop.x * w;
        let startY = drop.y * h;
        
        let dropLength = baseLength * drop.lengthMod * config.lengthMultiplier;
        
        let endX = startX + (dx * dropLength);
        let endY = startY + (dy * dropLength);

        // Abaikan garis jika posisinya sama sekali tidak terlihat di area canvas
        if (
          (startX < 0 && endX < 0) || (startX > w && endX > w) ||
          (startY < 0 && endY < 0) || (startY > h && endY > h)
        ) {
          continue; 
        }

        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
      }
      ctx.stroke(); // Eksekusi gambar (Sangat cepat karena dikelompokkan)
    }
  }

  // Tombol Download
  btnDownload.addEventListener('click', () => {
    if (!currentImage) {
      alert("Masbro upload foto dulu ya sebelum download!");
      return;
    }
    const link = document.createElement('a');
    link.download = 'Moody_Rain_Effect.png';
    link.href = canvas.toDataURL('image/png', 0.9);
    link.click();
  });
</script>
</body>
</html>
