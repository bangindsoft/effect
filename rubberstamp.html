<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rubber Stamp Effect Generator</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --accent: #ef4444; /* Red accent to match rubber stamp vibe */
      --accent-hover: #dc2626;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 5px 0;
      color: var(--accent);
      font-size: 1.5rem;
    }

    .header p {
      margin: 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      background: #020617;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .control-group {
      display: flex;
      flex-direction: column;
    }

    .control-group label {
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
    }
    
    .control-group label span.val { color: var(--text-main); }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    input[type="color"] {
      width: 100%;
      height: 35px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      padding: 2px;
    }

    .btn-upload {
      background: var(--border);
      color: #fff;
      border: 1px dashed var(--accent);
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
      grid-column: 1 / -1;
    }

    .btn-upload:hover { background: #475569; }
    input[type="file"] { display: none; }

    .canvas-container {
      width: 100%;
      /* CSS Checkerboard for transparent background preview */
      background: repeating-conic-gradient(#334155 0% 25%, #1e293b 0% 50%) 50% / 20px 20px;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 300px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    canvas {
      max-width: 100%;
      max-height: 60vh;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }

    .placeholder {
      position: absolute;
      color: var(--text-muted);
      font-size: 0.9rem;
      background: var(--bg-card);
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .btn-download {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-download:hover { background: var(--accent-hover); }
    .btn-download:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🛑 Rubber Stamp Generator</h1>
    <p>Turn your photos or logos into a grunge ink stamp.</p>
  </div>

  <div class="controls">
    <label for="img-upload" class="btn-upload" id="upload-label">
      📸 Upload Image
    </label>
    <input type="file" id="img-upload" accept="image/*">

    <div class="control-group">
      <label>Contrast Threshold <span class="val" id="val-thresh">128</span></label>
      <input type="range" id="inp-thresh" min="0" max="255" value="128">
    </div>

    <div class="control-group">
      <label>Grunge / Noise Level <span class="val" id="val-noise">15%</span></label>
      <input type="range" id="inp-noise" min="0" max="100" value="15">
    </div>

    <div class="control-group">
      <label>Stamp Ink Color</label>
      <input type="color" id="inp-color" value="#dc2626">
    </div>
  </div>

  <div class="canvas-container">
    <div class="placeholder" id="placeholder">Please upload an image first</div>
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <div class="footer-actions">
    <button class="btn-download" id="btn-download" disabled>⬇️ Download PNG (Transparent)</button>
  </div>
</div>

<script>
  const uploadInput = document.getElementById('img-upload');
  const uploadLabel = document.getElementById('upload-label');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const placeholder = document.getElementById('placeholder');
  const btnDownload = document.getElementById('btn-download');

  const inpThresh = document.getElementById('inp-thresh');
  const inpNoise = document.getElementById('inp-noise');
  const inpColor = document.getElementById('inp-color');

  const valThresh = document.getElementById('val-thresh');
  const valNoise = document.getElementById('val-noise');

  let currentImg = null;
  let offCanvas = document.createElement('canvas');
  let offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

  function updateLabels() {
    valThresh.textContent = inpThresh.value;
    valNoise.textContent = inpNoise.value + '%';
  }

  [inpThresh, inpNoise, inpColor].forEach(el => {
    el.addEventListener('input', () => {
      updateLabels();
      if (currentImg) renderStamp();
    });
  });

  uploadInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    uploadLabel.textContent = `⏳ Processing: ${file.name}...`;
    
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        currentImg = img;
        uploadLabel.textContent = `📸 Change Image`;
        placeholder.style.display = 'none';
        canvas.style.display = 'block';
        btnDownload.disabled = false;
        
        const maxW = 1000;
        let w = img.width;
        let h = img.height;
        if (w > maxW) {
          h = (maxW / w) * h;
          w = maxW;
        }
        
        offCanvas.width = w;
        offCanvas.height = h;
        offCtx.drawImage(img, 0, 0, w, h);
        
        canvas.width = w;
        canvas.height = h;

        renderStamp();
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  function renderStamp() {
    if (!currentImg) return;

    const w = canvas.width;
    const h = canvas.height;
    
    // Draw original image first to get pixel data
    ctx.drawImage(offCanvas, 0, 0, w, h);
    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;

    const thresh = parseInt(inpThresh.value, 10);
    const noise = parseInt(inpNoise.value, 10) / 100;
    
    // Convert selected hex color to RGB
    const hex = inpColor.value;
    const rInk = parseInt(hex.slice(1, 3), 16);
    const gInk = parseInt(hex.slice(3, 5), 16);
    const bInk = parseInt(hex.slice(5, 7), 16);

    for (let i = 0; i < data.length; i += 4) {
      const r = data[i];
      const g = data[i+1];
      const b = data[i+2];
      const a = data[i+3];

      // Skip fully transparent pixels
      if (a === 0) continue;

      // Calculate grayscale brightness
      const gray = 0.299 * r + 0.587 * g + 0.114 * b;

      // Binarize based on threshold
      if (gray < thresh) {
        // Pixel becomes "Ink"
        if (Math.random() < noise) {
          // Weathering effect (remove ink randomly)
          data[i+3] = 0;
        } else {
          // Apply ink color
          data[i] = rInk;
          data[i+1] = gInk;
          data[i+2] = bInk;
          data[i+3] = a; // preserve original alpha if it was partially transparent
        }
      } else {
        // Pixel becomes "Paper" (Transparent background)
        data[i+3] = 0; 
      }
    }

    // Clear canvas and put modified data back
    ctx.clearRect(0, 0, w, h);
    ctx.putImageData(imgData, 0, 0);
  }

  btnDownload.addEventListener('click', () => {
    if (!currentImg) return;
    const link = document.createElement('a');
    link.download = 'Rubber_Stamp_Effect.png'; // PNG for transparency
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
</script>

</body>
</html>
