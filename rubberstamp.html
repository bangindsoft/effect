<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Rubber Stamp Maker</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 5px 0;
      color: var(--accent);
      font-size: 1.5rem;
    }

    .header p {
      margin: 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      background: #020617;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .control-group {
      display: flex;
      flex-direction: column;
    }

    .control-group label {
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      color: var(--accent);
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-main);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
      margin-top: 10px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    input[type="color"] {
      width: 100%;
      height: 35px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      padding: 2px;
    }

    .canvas-container {
      width: 100%;
      background: repeating-conic-gradient(#334155 0% 25%, #1e293b 0% 50%) 50% / 20px 20px;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 300px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    canvas {
      max-width: 100%;
      max-height: 60vh;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      background: transparent;
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .btn-download {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-download:hover { background: var(--accent-hover); }

  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>✒️ Custom Rubber Stamp Maker</h1>
    <p>Design your own text-based grungy rubber stamp instantly.</p>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>Top Circular Text</label>
      <input type="text" id="inp-top" value="COMPANY NAME">
    </div>

    <div class="control-group">
      <label>Bottom Circular Text</label>
      <input type="text" id="inp-bottom" value="OFFICIAL SEAL">
    </div>

    <div class="control-group">
      <label>Center Text</label>
      <input type="text" id="inp-center" value="APPROVED">
    </div>

    <div class="control-group">
      <label>Stamp Color</label>
      <input type="color" id="inp-color" value="#dc2626">
    </div>

    <div class="control-group" style="grid-column: span 2;">
      <label>Grunge / Noise Level</label>
      <input type="range" id="inp-noise" min="0" max="100" value="30">
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="canvas" width="400" height="400"></canvas>
  </div>

  <div class="footer-actions">
    <button class="btn-download" id="btn-download">⬇️ Download Stamp (PNG)</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  
  const inpTop = document.getElementById('inp-top');
  const inpBottom = document.getElementById('inp-bottom');
  const inpCenter = document.getElementById('inp-center');
  const inpColor = document.getElementById('inp-color');
  const inpNoise = document.getElementById('inp-noise');
  const btnDownload = document.getElementById('btn-download');

  // Trigger render on input changes
  [inpTop, inpBottom, inpCenter, inpColor, inpNoise].forEach(el => {
    el.addEventListener('input', renderStamp);
  });

  function drawCircularText(ctx, str, cx, cy, radius, startAngle, isBottom) {
    ctx.save();
    ctx.translate(cx, cy);
    
    // Use monospace or standard font for consistent spacing, tracking can be simulated
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    
    // Calculate total angle based on text width
    let totalAngle = 0;
    // adding a bit of letter spacing
    const letterSpacing = 0.05; 
    
    for(let i=0; i<str.length; i++) {
      totalAngle += (ctx.measureText(str[i]).width / radius) + letterSpacing;
    }
    
    let angle = startAngle - (totalAngle / 2);
    
    for (let i = 0; i < str.length; i++) {
      let char = str[i];
      let charWidth = ctx.measureText(char).width;
      let charAngle = (charWidth / radius) + letterSpacing;
      
      ctx.save();
      ctx.rotate(angle + charAngle/2);
      
      if (isBottom) {
        ctx.translate(0, radius);
        ctx.rotate(Math.PI); 
      } else {
        ctx.translate(0, -radius);
      }
      
      ctx.fillText(char, 0, 0);
      ctx.restore();
      
      angle += charAngle;
    }
    ctx.restore();
  }

  function renderStamp() {
    const w = canvas.width;
    const h = canvas.height;
    const cx = w / 2;
    const cy = h / 2;
    
    // Clear canvas
    ctx.clearRect(0, 0, w, h);
    
    const color = inpColor.value;
    const topText = inpTop.value;
    const bottomText = inpBottom.value;
    const centerText = inpCenter.value;
    const noise = parseInt(inpNoise.value, 10) / 100;

    // Draw Stamp Elements
    ctx.strokeStyle = color;
    ctx.fillStyle = color;

    // Outer Thick Circle
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(cx, cy, 180, 0, Math.PI * 2);
    ctx.stroke();

    // Outer Thin Circle
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 170, 0, Math.PI * 2);
    ctx.stroke();

    // Inner Thin Circle
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 110, 0, Math.PI * 2);
    ctx.stroke();

    // Center Text
    ctx.font = "bold 36px 'Courier New', Courier, monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(centerText, cx, cy);

    // Circular Texts
    ctx.font = "bold 28px 'Courier New', Courier, monospace";
    if (topText) {
      drawCircularText(ctx, topText, cx, cy, 140, -Math.PI/2, false);
    }
    if (bottomText) {
      drawCircularText(ctx, bottomText, cx, cy, 140, Math.PI/2, true);
    }

    // Apply Grunge Effect (Noise masking)
    if (noise > 0) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;
      
      for (let i = 0; i < data.length; i += 4) {
        // If pixel is not fully transparent
        if (data[i+3] > 0) {
          // Randomly erase pixels to create weathered look
          if (Math.random() < noise) {
            data[i+3] = 0; // Make transparent
          } else {
            // Randomly reduce opacity slightly for semi-weathered look
            if (Math.random() < 0.5) {
              data[i+3] = Math.max(0, data[i+3] - (Math.random() * 100));
            }
          }
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }
  }

  // Initial render
  window.onload = renderStamp;

  btnDownload.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'Custom_Stamp.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
</script>
</body>
</html>
